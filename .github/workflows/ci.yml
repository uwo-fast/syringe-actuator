# All real work happens in individual jobs; `ok` is the single status check for branch
# protection. Pull requests only: with "require branches to be up to date" on, a run on push to
# main re-proves the PR run on an identical tree. `just check && just test` is the local
# equivalent.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # every: a file counts as code only if it matches ALL patterns, so the negations apply.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  cad:
    name: CAD
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Pinned: the gates depend on OpenSCAD's exact warnings and exports, and apt's OpenSCAD comes
    # with the runner image. 24.04 ships 2021.01, the version the gates were written against.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      # topiary formats the SCAD sources; its version decides its output, so it is pinned, by digest
      - name: Install topiary
        run: |
          name=topiary-cli-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/tweag/topiary/releases/download/v0.8.0/$name.tar.xz"
          echo "42e54ff151dd6b20621166a09e3a5df2b367a108799900c3adbfc9c10dc93aa1  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$name/topiary" /usr/local/bin/topiary
          topiary prefetch openscad
      - run: just setup
      - run: just check
      - run: just test

  # A job skipped by a conditional reports success, so `ok` fails only on failure or cancel.
  ok:
    name: ok
    if: always()
    needs: [changes, cad]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
